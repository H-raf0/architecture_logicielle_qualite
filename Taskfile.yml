version: '3'

# Taskfile - Commandes essentielles
# Installation: https://taskfile.dev/installation/
# Usage: task <nom-de-la-tache>

tasks:

  # BUILD
  build:
    desc: "Compiler le projet"
    cmds:
      - mvn clean compile

  test:
    desc: "Lancer tous les tests (unitaires, intégration, architecture, Cucumber)"
    cmds:
      - mvn test

  cucumber:
    desc: "Lancer les tests Cucumber BDD"
    cmds:
      - mvn test -Dtest=CucumberTestRunner

  architecture:
    desc: "Lancer les tests d'architecture"
    cmds:
      - mvn test -Dtest=ArchitectureTest

  package:
    desc: "Créer le JAR"
    cmds:
      - mvn clean package

  # DOCKER
  up:
    desc: "Démarrer Docker (app + Kafka)"
    cmds:
      - docker-compose up -d
      - echo "Services demarres - attente 30s pour l'app"
      - timeout /t 30 /nobreak

  down:
    desc: "Arrêter Docker"
    cmds:
      - docker-compose down

  logs:
    desc: "Voir les logs"
    cmds:
      - docker-compose logs -f app

  health:
    desc: "Vérifier la santé"
    cmds:
      - docker-compose ps
      - curl -s http://localhost:8080/actuator/health

  # API
  api:
    desc: "Ouvrir API"
    cmds:
      - echo "Ouvrez api/recettes.http"

  # QUICK WORKFLOWS
  start:
    desc: "Démarrer: build + docker up"
    cmds:
      - task build
      - task up

  stop:
    desc: "Arrêter: docker down + clean"
    cmds:
      - task down
      - mvn clean

  clean:
    desc: "Nettoyer (target/)"
    cmds:
      - mvn clean

  default:
    cmds:
      - task --list
    silent: true

stages:
  - build
  - test
  #  - quality
  - package

build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - ./mvnw clean compile

test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - ./mvnw test

#quality:
#  stage: quality
#  image: maven:3.9.6-eclipse-temurin-17
#  script:
#    - ./mvnw qulice:check

package:
  stage: package
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - ./mvnw package -DskipTests
  artifacts:
    paths:
      - target/*.jar
